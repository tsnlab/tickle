name: Test all

# Unlike performance.yml (which needs the two real, exclusively-held Raspberry Pis and so only
# runs post-merge), everything this workflow does is fully self-contained (network namespaces
# and QEMU processes standing in for two real nodes, not real hardware), so - like
# check-all.yml - it can run on every push and PR.
on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # third_party/FreeRTOS-Kernel and third_party/lwip are submodules the QEMU tier needs.
          submodules: true

      - name: Install RISC-V toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf picolibc-riscv64-unknown-elf \
            qemu-system-riscv

      - name: Lint (platform/freertos)
        run: make -C platform/freertos lint

      # Every self-contained test tier (unit tests, a real Linux-HAL round trip over network
      # namespaces, a real FreeRTOS-HAL round trip over emulated virtio-net) behind the one
      # command `make test-all` also runs locally - see the top-level Makefile.
      - name: make test-all
        run: make test-all

      - name: Upload logs and pcaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-all-logs
          path: |
            platform/linux/*.log
            platform/freertos/*.log
            platform/freertos/*.pcap
          if-no-files-found: ignore
