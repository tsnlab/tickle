name: Test all

# Unlike performance.yml (which needs the two real, exclusively-held Raspberry Pis and so only
# runs post-merge), everything this workflow does is fully self-contained (network namespaces
# and QEMU processes standing in for two real nodes, not real hardware), so - like
# check-all.yml - it can run on every push and PR.
on:
  - push
  - pull_request

# Two runs of this workflow on one commit contend for the runner, and on 2026-09-29/30 that produced a pair that
# disagreed: `573cfed9` and `df816bef` each got two `push`-triggered runs seconds apart, one success and one failure,
# on identical bytes. The failing one of the 573cfed9 pair lost 7.2 per cent of the perf tier's stream while its own
# shared-memory-off control arm, in the same run, lost none - the shared-memory ring drops when its reader is starved,
# where a socket buffer absorbs the same starvation and merely slows. So the suite is sensitive to a second copy of
# itself, and a workflow that sometimes collides with itself gets its failures explained away before anyone looks.
#
# Keyed on the SHA, and this is the second version: the first keyed on the ref with cancel-in-progress FALSE, chosen so
# that no commit would lose its verdict. It did the opposite. `cancel-in-progress: false` keeps the RUNNING run alive,
# but GitHub allows one PENDING run per group and a newly queued run cancels the previously pending one - so with pushes
# arriving faster than the suite completes, intermediate commits got no result at all. On 2026-09-30 `6de94cbd`, which
# carried a real fix, had both workflows cancelled and zero CI answer, and `33dcb786` lost one of its two. That is worse
# than the duplicate runs it replaced: duplicates gave two answers that sometimes disagreed, which is noisy but
# readable, and this gave none - the exact shape that let thirteen commits of red go unseen.
#
# `cancel-in-progress: false` reads as "nothing is cancelled" and means "the running one is not cancelled". The name
# describes the configuration and not the outcome, which is the same gap as a VOID rule that checked `transport=tcp`
# and a CI condition that checked whether a counter field existed.
#
# The bug being fixed was two runs for ONE SHA, so the group names exactly that and nothing wider. Two runs of one
# commit collapse to one; different commits never touch each other's runs, so no verdict can be lost. cancel-in-progress
# is true here because the two runs it can ever collapse are of identical bytes, where discarding one loses nothing.
#
# What this does NOT do is serialise different commits, so cross-commit contention on one runner is possible again. That
# was never the observed cause - both pairs found on 2026-09-29/30 were two runs of one SHA seconds apart - and if it
# ever is, it needs a runner-level answer rather than a concurrency group, because a group can only cancel or queue and
# queueing is what ate a verdict here.
concurrency:
  group: test-all-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# Six jobs run the tiers side by side, each on its own runner, and `test` gates on all of them (2026-10-17); a seventh,
# rmw-acceptance, joined on 2026-10-24. Before 2026-10-17 one job ran every tier in sequence: 33 min on 2026-10-17,
# against 16-19 min on 2026-10-07, while the only steps that can share a machine without changing their results are the static checks. Every tier, flag and timeout is as it was;
# only where each runs changed. On separate runners no integration tier shares a CPU with a sanitizer build, which the
# perf tier's sensitivity to a second copy of the suite (the concurrency note above) makes the safer arrangement anyway.
#
# Each tier is still its own continue-on-error step, so every tier is attempted and recorded even after another
# fails; each job hands its step outcomes up as job outputs, and `test` fails if any gated outcome is not `success` or
# any job did not finish with `success` - so a job that died before reaching a tier (checkout, apt, a timeout) leaves
# an empty outcome and fails the gate instead of reading as a pass.
#
# Runner pin, for every job: ubuntu-24.04 rather than ubuntu-latest (2026-09-23). GitHub moves that label to Ubuntu 26
# on 2026-10-19, and an image change landing by itself, mid-task, is the kind of surprise that costs a day to
# attribute. This pin is a scheduling decision, not a compatibility claim - we have not tested Ubuntu 26 and are not
# asserting anything about it either way. Move to ubuntu-26.04 deliberately, as its own change, with its own CI run.
#
# Builds use -j$(nproc): until 2026-10-17 the unit tests compiled one binary at a time, which was 83 s of the plain
# run, 105 s of coverage and 544 s of ASan + UBSan. Each test binary is its own make target with its own output files
# (coverage's .gcno/.gcda are prefixed with the binary's name), and check-gates has built `sanitize` with -j8 since
# 2026-10-16. The tests themselves still run one at a time, in the same order.
jobs:
  # Linux build, the static checks, the plain unit tests, ThreadSanitizer, the fuzz smoke and the same-host tier.
  linux-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25 # about 5 min on 2026-10-17's step timings
    outputs:
      build_linux: ${{ steps.build_linux.outcome }}
      doc_shas: ${{ steps.doc_shas.outcome }}
      headers: ${{ steps.headers.outcome }}
      unit: ${{ steps.unit.outcome }}
      tsan: ${{ steps.tsan.outcome }}
      fuzz: ${{ steps.fuzz.outcome }}
      itest_samehost: ${{ steps.itest_samehost.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          # Full history, for the "Documented commit ids resolve" step below. actions/checkout
          # defaults to depth 1, and against a shallow clone `git cat-file -e` fails for every
          # historical sha - so that step would report all 83 citations as missing and be a gate
          # that fails on a correct tree. Set from the documented default rather than discovered
          # from a red run. Only this job reads history; the others check out at depth 1.
          fetch-depth: 0

      - name: Build - Linux x86-64
        id: build_linux
        continue-on-error: true
        run: make all

      # Every commit sha the documents cite must exist and be reachable. Six did not, and none of
      # them was careless: each was recorded from the sha in front of whoever did the work, and a
      # rebase before the push changed it. "Record the sha with every figure" cannot catch that,
      # because the person recording it cannot tell at the time - only something that looks
      # afterwards can, which is what this is.
      - name: Documented commit ids resolve
        id: doc_shas
        continue-on-error: true
        run: make check-doc-shas

      # Every public header, as C and as C++. rmw_tickle's typesupport is C++ and includes these,
      # so a C-only construct in one breaks it - and nothing else in this workflow can see that,
      # because every other tier is C. _Static_assert in config.h took the Check-all workflow red
      # for eight commits before anyone looked, which is what this step exists to prevent.
      - name: Public headers compile as C and C++
        id: headers
        continue-on-error: true
        run: make headers-cpp

      - name: Unit tests (mock HAL)
        id: unit
        continue-on-error: true
        run: make -j"$(nproc)" test

      # Core is callable from several threads (tickle.h, "Threading"). The plain unit run checks the
      # multi-threaded test's outcome; ThreadSanitizer checks the way there. Against the core as it was
      # before locking, this test produced 14 race reports - see tests/test_thread_safety.c.
      - name: Thread-safety test under ThreadSanitizer
        id: tsan
        continue-on-error: true
        run: make tsan

      - name: Fuzz smoke (packet parser)
        id: fuzz
        continue-on-error: true
        run: make fuzz FUZZ_ARGS='-max_total_time=45 -error_exitcode=1'

      # Real sockets, two nodes, one host - the case the unit suite cannot reach because it mocks
      # the HAL away, and the case a bug lived in until a benchmark found it. No root needed, so
      # unlike the netns tier it is not a privilege question whether this runs.
      - name: Integration - two nodes on one host
        id: itest_samehost
        continue-on-error: true
        run: make test-samehost

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-all-logs-linux-unit
          path: platform/linux/*.log
          if-no-files-found: ignore

  # Line and branch coverage of core by the unit tests (QUALITY_DECLARATION.md 4.iii): tracked, not enforced - no
  # figure fails anything. It builds into its own obj/coverage/ tree. The longest job: test_hybrid_send runs about 240 s
  # of it under --coverage, against about 90 s plain.
  #
  # The step IS gated ("Coverage report" in `test`), on whether a report was produced, not on its value. Until
  # 2026-10-17 it was not, and gcovr had been crashing unseen: the step was continue-on-error and outside the Gate list,
  # so the job read as success and `coverage-report` was uploaded with no summary in it.
  #
  # gcovr is pinned from PyPI rather than taken from apt. ubuntu-24.04's apt gcovr is 7.0, whose gcov parser requires a
  # space after the count field of a block line (`%%%%%: 1234-block 0`); gcov prints the line number in a 5-wide
  # field, so from line 10000 on there is none (`%%%%%:10003-block  0`), and once tickle.c passed 10,000 lines gcovr
  # 7.0 raised UnknownLineType on every such line and wrote no report. gcovr 7.2 made the space optional; 8.3 is pinned
  # so that a newer apt or runner image cannot change the parser under us. The Makefile says why it also passes
  # --merge-mode-functions=separate.
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # about 6.5 min on 2026-10-17's step timings
    outputs:
      coverage: ${{ steps.coverage.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Coverage (tracked, not enforced)
        id: coverage
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/gcovr"
          "$RUNNER_TEMP/gcovr/bin/pip" install --quiet gcovr==8.3
          make -j"$(nproc)" coverage GCOVR="$RUNNER_TEMP/gcovr/bin/gcovr"
          python3 .github/scripts/coverage_summary.py platform/linux/obj/coverage/report/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always() && steps.coverage.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: platform/linux/obj/coverage/report/
          if-no-files-found: warn

  # The unit tests again under AddressSanitizer + UndefinedBehaviorSanitizer, in their own obj/sanitize/ tree.
  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # about 5 min on 2026-10-17's step timings with a parallel build (11 min serial)
    outputs:
      sanitize: ${{ steps.sanitize.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Unit tests under ASan + UBSan
        id: sanitize
        continue-on-error: true
        run: make -j"$(nproc)" sanitize

  linux-netns:
    runs-on: ubuntu-24.04
    timeout-minutes: 25 # about 4 min on 2026-10-17's step timings; ping_pong and perf run for fixed times
    outputs:
      itest_linux: ${{ steps.itest_linux.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Integration - Linux HAL over netns
        id: itest_linux
        continue-on-error: true
        run: make test-linux

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-all-logs-linux-netns
          path: platform/linux/*.log
          if-no-files-found: ignore

  # S8's control arm (RMW_GAPS_PLAN.md): the same suite with the shared-memory module compiled out. On
  # 2026-09-29 this suite was red for thirteen commits and nothing in CI could say whether the module was the
  # cause; it was, and that was established by a person building the tree both ways in a terminal. The script
  # refuses to run if the two libraries come out byte-identical, so the arm cannot silently become a no-op.
  # Its own runner also keeps its `make clean` away from every other tier's objects.
  linux-netns-shm-off:
    runs-on: ubuntu-24.04
    timeout-minutes: 25 # about 4 min on 2026-10-17's step timings
    outputs:
      itest_linux_shm_off: ${{ steps.itest_linux_shm_off.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Integration - Linux HAL over netns, shared memory OFF (control)
        id: itest_linux_shm_off
        continue-on-error: true
        run: .github/scripts/test_linux_module_off.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-all-logs-linux-netns-shm-off
          path: platform/linux/*.log
          if-no-files-found: ignore

  freertos:
    runs-on: ubuntu-24.04
    timeout-minutes: 25 # about 4.5 min on 2026-10-17's step timings; each QEMU run lasts a fixed `timeout`
    outputs:
      build_freertos: ${{ steps.build_freertos.outcome }}
      lint_freertos: ${{ steps.lint_freertos.outcome }}
      itest_freertos: ${{ steps.itest_freertos.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # third_party/FreeRTOS-Kernel and third_party/lwip are submodules the QEMU tier needs.
          submodules: true

      # The apt packages this job installs, kept between runs - the same mechanism as check-all.yml's "Restore the apt
      # package cache", which says why it cannot change what is installed. On 2026-10-22 (run 39817983477, 25dd0fb0) this
      # job hit its 25-minute timeout inside "Install RISC-V toolchain and QEMU": 296 MB from azure.archive.ubuntu.com,
      # picolibc-riscv64-unknown-elf (158 MB) timed out after 4 min 50 s, and qemu-system-misc (57.7 MB) was still
      # downloading 5 min later when the job was cancelled. The step takes under a minute on a good mirror. Its own key
      # prefix: the package set differs from Check all's.
      - name: Restore the apt package cache
        id: apt_cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5
        with:
          path: ~/apt-debs
          key: apt-debs-freertos-ubuntu-24.04-v1-${{ github.run_id }}
          restore-keys: apt-debs-freertos-ubuntu-24.04-v1-

      - name: Seed apt's archive directory from the cache
        run: |
          # apt-get keeps what it downloads by default; set it anyway, so the save step cannot silently see nothing.
          sudo tee /etc/apt/apt.conf.d/99tickle-keep-debs > /dev/null <<'EOF'
          APT::Keep-Downloaded-Packages "true";
          Binary::apt::APT::Keep-Downloaded-Packages "true";
          EOF
          : > "$RUNNER_TEMP/apt-seeded.txt"
          if [ -d "$HOME/apt-debs" ]; then
            find "$HOME/apt-debs" -maxdepth 1 -name '*.deb' -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/apt-seeded.txt"
            # Same filesystem, so a rename: no second copy on the runner's disk.
            find "$HOME/apt-debs" -maxdepth 1 -name '*.deb' -exec sudo mv -t /var/cache/apt/archives/ {} +
          fi
          echo "seeded $(wc -l < "$RUNNER_TEMP/apt-seeded.txt") .deb files from cache entry" \
            "'${{ steps.apt_cache.outputs.cache-matched-key }}'"

      - name: Install RISC-V toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf picolibc-riscv64-unknown-elf \
            qemu-system-misc

      - name: Build - FreeRTOS RISC-V
        id: build_freertos
        continue-on-error: true
        run: make -C platform/freertos all

      - name: Lint - FreeRTOS
        id: lint_freertos
        continue-on-error: true
        run: make -C platform/freertos lint

      - name: Integration - FreeRTOS HAL over QEMU virtio-net
        id: itest_freertos
        continue-on-error: true
        run: make test-freertos

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-all-logs-freertos
          path: platform/freertos/*.log
          if-no-files-found: ignore

      # The other half of "Restore the apt package cache" above; the same collect and save as check-all.yml's.
      - name: Collect the apt packages this job installed
        id: apt_collect
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          archives=/var/cache/apt/archives
          dir="$HOME/apt-debs"
          touch "$RUNNER_TEMP/apt-seeded.txt"
          rm -rf "$dir"
          mkdir -p "$dir"
          dpkg-query -W -f='${Package}:${Architecture}=${Version}\n' | sort -u > "$RUNNER_TEMP/apt-installed.txt"
          shopt -s nullglob
          for deb in "$archives"/*.deb; do
            id=$(dpkg-deb --show --showformat='${Package}:${Architecture}=${Version}' "$deb" 2> /dev/null) || continue
            if grep -qxF -- "$id" "$RUNNER_TEMP/apt-installed.txt"; then
              cp "$deb" "$dir/"
            fi
          done
          find "$dir" -maxdepth 1 -name '*.deb' -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/apt-kept.txt"
          kept=$(wc -l < "$RUNNER_TEMP/apt-kept.txt")
          reused=$(LC_ALL=C comm -12 "$RUNNER_TEMP/apt-kept.txt" "$RUNNER_TEMP/apt-seeded.txt" | wc -l)
          echo "$kept installed .deb files, $reused of them seeded from the cache, $(du -sh "$dir" | cut -f1)"
          if [ "$kept" -eq 0 ]; then
            echo "::warning::no .deb files left in /var/cache/apt/archives - apt deleted them, so nothing is cached"
            echo "key=" >> "$GITHUB_OUTPUT"
          else
            echo "key=apt-debs-freertos-ubuntu-24.04-v1-$(sha256sum < "$RUNNER_TEMP/apt-kept.txt" | cut -c1-16)" \
              >> "$GITHUB_OUTPUT"
          fi

      - name: Save the apt package cache
        if: >-
          ${{ !cancelled() && steps.apt_collect.outputs.key != ''
          && steps.apt_collect.outputs.key != steps.apt_cache.outputs.cache-matched-key }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/apt-debs
          key: ${{ steps.apt_collect.outputs.key }}

  # rmw_tickle's acceptance suite (rmw_tickle/scripts/rmw_gap_acceptance.sh, 16 ordinary ROS 2 scenarios across two
  # network namespaces, each run on rmw_cyclonedds_cpp as the control and then on rmw_tickle), added 2026-10-24 at the
  # user's decision. CI had never run it, and `durable` - a late TRANSIENT_LOCAL subscriber - delivered 0 of 4 samples
  # from d25c12a2 (2026-10-20) for four days before anyone ran the suite by hand.
  #
  # Its own job, which builds rmw_tickle and the interface workspace again rather than reusing Check all's build: that
  # job runs 35-60 min, and a job reusing its output could only start after it. Here the ~6 min of building runs in
  # parallel with everything else, so the job (~30 min) still ends before Check all does.
  #
  # -c is the suite's CI mode: every case must PASS on both arms. A FAIL or ERROR on rmw_tickle and a control that did
  # not pass (VOID) both fail the step with the case named; a case that cannot run on this runner (besvc without
  # sch_netem) exits 4 and fails it too, as NOT RUN, so a missing kernel module neither passes silently nor reads as an
  # rmw_tickle defect. jazzy, like Check all: the suite was written against lyrical locally, so ROS_DISTRO_DIR says so.
  rmw-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 50 # setup-ros ~3 min on a good mirror, the two builds ~6 min, the suite 19 min on this PC
    outputs:
      acceptance: ${{ steps.acceptance.outcome }}
    env:
      ROS_DISTRO_DIR: /opt/ros/jazzy
      ACCEPT_WS: ${{ github.workspace }}/../accept_ws
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Check all's apt cache, restored and never saved from here: its entries hold what setup-ros installs for jazzy,
      # which is nearly all this job downloads, and a second writer under the same prefix would make the two jobs
      # replace each other's entries. Check all's "Restore the apt package cache" says why it cannot change what is
      # installed.
      - name: Restore the apt package cache (Check all's)
        id: apt_cache
        continue-on-error: true
        uses: actions/cache/restore@v6
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 5
        with:
          path: ~/apt-debs
          key: apt-debs-ubuntu-24.04-v1-${{ github.run_id }}
          restore-keys: apt-debs-ubuntu-24.04-v1-

      - name: Seed apt's archive directory from the cache
        run: |
          if [ -d "$HOME/apt-debs" ]; then
            find "$HOME/apt-debs" -maxdepth 1 -name '*.deb' -exec sudo mv -t /var/cache/apt/archives/ {} +
          fi
          echo "seeded from cache entry '${{ steps.apt_cache.outputs.cache-matched-key }}'"

      # The same pinned apt source as Check all's step of this name, for the same reason (setup-ros's unauthenticated
      # api.github.com lookup runs out of quota on shared runner addresses).
      - name: Install the ROS 2 apt source (pinned, so setup-ros does not look it up)
        run: |
          version=1.3.0
          codename=$(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
          curl --fail --location --retry 3 --retry-delay 5 -o /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/$version/ros2-apt-source_$version.${codename}_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          rm -f /tmp/ros2-apt-source.deb
          sudo apt-get update
          apt-cache policy | grep -q 'packages.ros.org/ros2/ubuntu'

      - name: Set up ROS 2
        id: setup_ros
        continue-on-error: true
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Wait before retrying ROS 2 setup
        if: steps.setup_ros.outcome == 'failure'
        run: sleep 60

      - name: Set up ROS 2, retry
        if: steps.setup_ros.outcome == 'failure'
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      # What the suite runs beyond rmw_tickle: the control rmw, rclpy and ros2cli, rosbag2 for bag and bagstall,
      # sensor_msgs and std_srvs for durable, inprocess and besvc. Most come with setup-ros's desktop install; naming them
      # makes a missing one an apt error here instead of a VOID case later. iproute2 is ip netns and tc.
      #
      # sch_netem is besvc's lossy arm. Azure's kernel ships it in linux-modules-extra on some images and not at all on
      # others; loading it is attempted, and whether it worked is printed, but not enforced here - the suite probes tc
      # netem itself and reports besvc NOT RUN (exit 4) if it is missing.
      - name: Install the suite's runtime packages and load sch_netem
        run: |
          sudo apt-get install -y iproute2 \
            ros-jazzy-rmw-cyclonedds-cpp ros-jazzy-rclpy ros-jazzy-ros2cli ros-jazzy-ros2node ros-jazzy-ros2param \
            ros-jazzy-ros2topic ros-jazzy-rosbag2 ros-jazzy-sensor-msgs ros-jazzy-std-srvs
          uname -r
          if ! sudo modprobe sch_netem; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe sch_netem || true
          fi
          if grep -qw '^sch_netem' /proc/modules || [ -d /sys/module/sch_netem ]; then
            echo "sch_netem: loaded"
          else
            echo "::warning::sch_netem could not be loaded on kernel $(uname -r); besvc will report NOT RUN"
          fi

      - name: Install tickle_typesupport for the system python3
        # The generator imports tickle_typesupport (tools/typesupport), which Check all pip-installs into
        # setup-python's interpreter; this job builds with the system python3 setup-ros installed ROS 2 against, so it
        # goes there. --no-deps: its one dependency, empy, comes from ROS 2's own apt packages.
        run: python3 -m pip install --user --break-system-packages --no-deps ./tools/typesupport

      - name: Build rmw_tickle and the interface workspace
        run: rmw_tickle/scripts/build_acceptance_ws.sh -w "$ACCEPT_WS"

      - name: rmw_tickle acceptance suite (CI mode)
        id: acceptance
        continue-on-error: true
        run: |
          OUTDIR="$RUNNER_TEMP/acceptance" rmw_tickle/scripts/rmw_gap_acceptance.sh -c -w "$ACCEPT_WS" && rc=0 || rc=$?
          {
            echo "## rmw_tickle acceptance suite"
            echo '```'
            cat "$RUNNER_TEMP/acceptance/summary.txt" 2>/dev/null || echo "no summary.txt - the suite did not start"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          case "$rc" in
            0) ;;
            1) echo "::error::acceptance: a case failed on rmw_tickle or its control failed (VOID) - see the CI: lines" ;;
            3) echo "::error::acceptance: rmw_tickle resolved to another workspace than $ACCEPT_WS" ;;
            4) echo "::error::acceptance: every case that ran passed, but a case could NOT RUN on this runner" ;;
            *) echo "::error::acceptance: the suite exited $rc" ;;
          esac
          exit "$rc"

      - name: Upload the per-case logs
        if: always() && steps.acceptance.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: rmw-acceptance-logs
          path: ${{ runner.temp }}/acceptance/
          if-no-files-found: warn

      - name: Fail the job when the suite did not pass
        # The suite step continues on error so the logs above are uploaded; without this step its failure would leave
        # the job green, and the gate below reads the job's result (2026-10-24: an exit 3 passed as success).
        if: always() && steps.acceptance.outcome != 'success'
        run: |
          echo "::error::the acceptance suite step ended '${{ steps.acceptance.outcome }}'"
          exit 1

  # The gate, under the job name the workflow has always had, so a required "test" check keeps meaning "every tier".
  test:
    needs: [linux-unit, coverage, sanitize, linux-netns, linux-netns-shm-off, freertos, rmw-acceptance]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the "Publish dashboard" step below pushes to gh-pages (main only)
    steps:
      - name: Checkout
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v7

      - name: Publish dashboard (build/test section)
        # Only a push to main updates the shared status page; PRs still run every tier above.
        # continue-on-error: a flaky gh-pages push must not turn the test signal red - "Gate" does that.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          map() { case "$1" in success) echo pass;; failure) echo fail;; *) echo skipped;; esac; }
          cat > buildtest-frag.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "commit_short": "${GITHUB_SHA:0:7}",
            "date": "$(date -u +%Y-%m-%dT%H:%MZ)",
            "branch": "${GITHUB_REF_NAME}",
            "run_url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "rows": {
              "linux": {
                "build": "$(map '${{ needs.linux-unit.outputs.build_linux }}')",
                "unit": "$(map '${{ needs.linux-unit.outputs.unit }}')",
                "integration": "$(map '${{ needs.linux-netns.outputs.itest_linux }}')"
              },
              "freertos": {
                "build": "$(map '${{ needs.freertos.outputs.build_freertos }}')",
                "unit": "n/a",
                "integration": "$(map '${{ needs.freertos.outputs.itest_freertos }}')"
              }
            }
          }
          EOF
          .github/scripts/publish_dashboard.sh buildtest buildtest-frag.json

      # Strictly `success`, not "not failure": a tier whose job died before reaching it has an empty outcome, which
      # the one-job version could not produce and which must not pass.
      - name: Gate - fail the job if any tier or job failed
        run: |
          fail=0
          for s in \
            'Build Linux=${{ needs.linux-unit.outputs.build_linux }}' \
            'Build FreeRTOS=${{ needs.freertos.outputs.build_freertos }}' \
            'Lint FreeRTOS=${{ needs.freertos.outputs.lint_freertos }}' \
            'Doc commit ids=${{ needs.linux-unit.outputs.doc_shas }}' \
            'Headers C/C++=${{ needs.linux-unit.outputs.headers }}' \
            'Unit tests=${{ needs.linux-unit.outputs.unit }}' \
            'Sanitizers=${{ needs.sanitize.outputs.sanitize }}' \
            'Coverage report=${{ needs.coverage.outputs.coverage }}' \
            'ThreadSanitizer=${{ needs.linux-unit.outputs.tsan }}' \
            'Fuzz smoke=${{ needs.linux-unit.outputs.fuzz }}' \
            'Same-host=${{ needs.linux-unit.outputs.itest_samehost }}' \
            'Integration Linux=${{ needs.linux-netns.outputs.itest_linux }}' \
            'Integration Linux shm-off=${{ needs.linux-netns-shm-off.outputs.itest_linux_shm_off }}' \
            'Integration FreeRTOS=${{ needs.freertos.outputs.itest_freertos }}' \
            'rmw acceptance=${{ needs.rmw-acceptance.outputs.acceptance }}' \
            'job linux-unit=${{ needs.linux-unit.result }}' \
            'job coverage=${{ needs.coverage.result }}' \
            'job sanitize=${{ needs.sanitize.result }}' \
            'job linux-netns=${{ needs.linux-netns.result }}' \
            'job linux-netns-shm-off=${{ needs.linux-netns-shm-off.result }}' \
            'job freertos=${{ needs.freertos.result }}' \
            'job rmw-acceptance=${{ needs.rmw-acceptance.result }}'; do
            name="${s%%=*}"; outcome="${s#*=}"
            printf '%-26s %s\n' "$name" "${outcome:-<none>}"
            if [ "$outcome" != success ]; then fail=1; fi
          done
          exit $fail
