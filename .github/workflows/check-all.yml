name: Check all

on:
  - push
  - pull_request

jobs:
  check-all:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          # third_party/FreeRTOS-Kernel and third_party/lwip hold the headers the synthesised
          # src/hal_freertos.c compile-DB entry below points clang-tidy at.
          submodules: true

      - name: Install build packages
        run: |
          sudo apt update
          # fastddsgen: examples/perf_hil/fastdds/build.sh's own codegen dependency (below) - idlc,
          # examples/perf_hil/cyclonedds/build.sh's own equivalent, ships inside ros-jazzy-cyclonedds
          # instead (installed by "Set up ROS 2" below), nothing extra needed for it here.
          sudo apt install -y bear gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf fastddsgen

      - name: Set up ROS 2 (for rmw_tickle)
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build examples/perf_hil (for clang-tidy's own compile_commands.json coverage)
        # continue-on-error, not a hard gate (2026-09-20): examples/perf_hil's own build.sh scripts
        # are written for/verified on the tickle-hil rpis (aarch64), not this job's own x86_64
        # runner - real compilation here is a genuine best-effort extra, not something the rest of
        # this job (colcon build, rmw_tickle's own tests, the conformance suite) should ever be
        # blocked by if something about this specific environment doesn't quite match. Before this
        # step existed, cpp-linter's own clang-tidy sub-check had no compile_commands.json entries
        # at all for these files, so every push touching examples/perf_hil/{cyclonedds,fastdds}
        # failed "Check all" on a plain "'dds/dds.h'/'fastdds/...' file not found" - a real,
        # repeated regression (dcdaa30, fd9db40, e38be7e, b56b982 all hit it), not a hypothetical.
        # Reusing each scenario's own real build.sh (already verified working end-to-end on real
        # hardware) under `bear` rather than hand-rolling a second, parallel set of -I flags here -
        # bear intercepts every gcc/g++ invocation build.sh's own loop below spawns and records it,
        # so this only has to actually compile, not separately reverse-engineer its own include
        # paths.
        continue-on-error: true
        run: |
          source /opt/ros/jazzy/setup.bash
          (
            cd examples/perf_hil/cyclonedds
            bear --output compile_commands.json -- bash -c '
              for s in best_effort_latency reliable_latency best_effort_throughput reliable_throughput durability_late_join; do
                ./build.sh "$s"
              done'
          )
          (
            cd examples/perf_hil/fastdds
            bear --output compile_commands.json -- bash -c '
              for s in best_effort_latency reliable_latency best_effort_throughput reliable_throughput durability_late_join; do
                ./build.sh "$s"
              done'
          )

      - name: Regenerate typesupport codecs and check for drift
        run: |
          pip install ./tools/typesupport
          make regen
          # A .msg/.srv edited without re-running `make regen`, or a generated .c/.h hand-edited
          # directly (tools/typesupport/PLAN.md: "do not edit generated codecs") both show up
          # here as an unexpected diff - fail the build rather than silently drifting.
          git diff --exit-code -- examples/uint64 examples/set_bool examples/ping_pong examples/perf

      - name: Generate compile_commands.json
        run: |
          bear -- make all
          # `make all` builds only the Linux platform, so any FreeRTOS-only source - src/
          # hal_freertos.c, and every examples/freertos/**/main_*.c role driver, each with its
          # own role-specific -I (platform/freertos/Makefile's own ROLE_INCLUDES table) - would
          # reach clang-tidy with no lwIP/picolibc/cross-target context and fail to even parse
          # ('FreeRTOS.h' file not found). None has an entry to inherit flags from, so synthesise
          # one each: the same cross-compile flags platform/freertos/Makefile's own `lint` target
          # uses (--target instead of gcc's --specs=picolibc.specs, which clang ignores;
          # -nostdinc + explicit -isystem so the host headers don't leak in and clash with
          # picolibc's).
          picolibc_inc="$(dpkg -L picolibc-riscv64-unknown-elf | grep -E '/include$' | head -1)"
          gcc_inc="$(riscv64-unknown-elf-gcc -print-file-name=include)"
          fr=platform/freertos

          # file (relative to repo root) : role-specific extra -I (relative to $fr, matching
          # platform/freertos/Makefile's ROLE_INCLUDES for that same file's MAIN_SRC/ROLE_SRCS) -
          # each one is a generated-codec directory (examples/<proto>/, tools/typesupport/
          # PLAN.md's M5 milestone), not the driver's own.
          entries=(
            "src/hal_freertos.c:"
            "examples/freertos/ping_pong/main_ping.c:../../examples/ping_pong"
            "examples/freertos/ping_pong/main_pong.c:../../examples/ping_pong"
            "examples/freertos/uint64/main_publisher.c:../../examples/uint64"
            "examples/freertos/uint64/main_subscriber.c:../../examples/uint64"
            "examples/freertos/set_bool/main_client.c:../../examples/set_bool"
            "examples/freertos/set_bool/main_server.c:../../examples/set_bool"
            "examples/freertos/perf/main_perf_client.c:../../examples/perf"
            "examples/freertos/perf/main_perf_server.c:../../examples/perf"
          )

          for entry in "${entries[@]}"; do
            file="${entry%%:*}"
            role_include="${entry#*:}"
            args=(clang --target=riscv32-unknown-elf -nostdinc -ffreestanding -DTT_PLATFORM_FREERTOS \
              -isystem "$picolibc_inc" -isystem "$gcc_inc" \
              -I. -Iboard -Ilwip_arch)
            [ -n "$role_include" ] && args+=("-I$role_include")
            args+=(-I../../third_party/FreeRTOS-Kernel/include \
              -I../../third_party/FreeRTOS-Kernel/portable/GCC/RISC-V \
              -I../../third_party/lwip/src/include \
              -I../../third_party/lwip/contrib/ports/freertos/include \
              -I../../include -I../../src \
              -c "$PWD/$file")
            jq --arg root "$PWD" --arg fr "$fr" --arg file "$PWD/$file" --argjson args "$(printf '%s\n' "${args[@]}" | jq -R . | jq -s .)" \
              '. + [{directory: ($root + "/" + $fr), file: $file, arguments: $args}]' \
              compile_commands.json > compile_commands.tmp
            mv compile_commands.tmp compile_commands.json
          done

          # tools/typesupport/tests/fixtures_ros2_adapter/'s hand-written rosidl_runtime_c/
          # rosidl_generator_c stand-ins (see that directory's own README) cross-include each
          # other via ROS 2's own relative-path convention (`#include "rosidl_runtime_c/
          # string.h"`), but being test fixtures rather than anything `make all`/`bear` actually
          # compiles, have no entry of their own in compile_commands.json - clang-tidy then can't
          # resolve those includes at all ('file not found') rather than just flag a style issue.
          # Synthesise one entry per header, same approach as the FreeRTOS block above.
          fra=tools/typesupport/tests/fixtures_ros2_adapter
          for f in rosidl_runtime_c/string.h rosidl_runtime_c/string_functions.h rosidl_runtime_c/primitives_sequence_functions.h test_msgs/msg/arrays.h test_msgs/msg/bounded_string.h; do
            args=(clang -std=c11 -I"$PWD/$fra" -c "$PWD/$fra/$f")
            jq --arg root "$PWD" --arg file "$PWD/$fra/$f" --argjson args "$(printf '%s\n' "${args[@]}" | jq -R . | jq -s .)" \
              '. + [{directory: $root, file: $file, arguments: $args}]' \
              compile_commands.json > compile_commands.tmp
            mv compile_commands.tmp compile_commands.json
          done

      - name: Generate compile_commands.json for rmw_tickle
        run: |
          # rmw_tickle needs a real ROS 2 environment (ament_cmake, rcutils, rmw, rosidl_runtime_c)
          # colcon can find via `find_package`. Tried running colcon inside a throwaway ROS Docker
          # container instead of installing ROS onto the runner directly - twice: first the whole
          # job in a container (broke the plain `sudo apt install bear` step above with an
          # unanswerable interactive prompt); then just this one step in its own `docker run`
          # (colcon succeeded, but clang-tidy - run on the *host*, by cpp-linter-action, below -
          # could resolve our own headers fine once the container was mounted at the runner's own
          # $PWD, but could never resolve rcutils/rmw/rosidl_runtime_c's own headers, because those
          # only exist inside the `--rm`-and-gone container's /opt/ros, never on the host at all).
          # `ros-tooling/setup-ros@v0.7` (above) sidesteps the whole class of problem: it installs
          # ROS 2 straight onto the runner's own filesystem via apt, so every header colcon's build
          # sees is a header clang-tidy can see afterward too - same convention every other
          # ros-tooling-based ROS 2 CI uses, and it brought colcon with it (part of the ROS 2 dev
          # tools it installs), so nothing else to add here. It doesn't put ament_cmake etc. on
          # CMAKE_PREFIX_PATH by itself, though - every step needing them sources setup.bash, the
          # same way a fresh terminal on a real ROS 2 install would. ament_cmake's own package.xml
          # parsing shells out to `python3` expecting catkin_pkg (installed for the *system*
          # python3 alongside ROS 2 itself) - but actions/setup-python above already put its own
          # Python 3.12 first on PATH, so that's the `python3` CMake finds instead. Give it
          # catkin_pkg too rather than fight over which python3 wins.
          source /opt/ros/jazzy/setup.bash
          # rosidl_generator_c (rosidl_typesupport_tickle_c_tests's own dependency - see its
          # package.xml) unconditionally depends on rosidl_generator_type_description for every
          # interface it generates, which needs NumPy (array field type hashing) and lark (parsing
          # its own .idl input) - neither on the *system* python3 ros-tooling/setup-ros installed
          # ROS 2 against are visible here. pip install rather than `apt install python3-...`, for
          # the same reason as catkin_pkg right below: actions/setup-python's own Python 3.12 is
          # first on PATH, so that's the python3 CMake's find_package(Python3) resolves to, not
          # the system one apt's packages would land in.
          pip install numpy lark catkin_pkg
          # Two colcon build calls, not one covering all four packages: rosidl_typesupport_tickle_c_
          # tests' own rosidl_generate_interfaces() call needs rosidl_typesupport_tickle_c/_cpp to
          # already be *discoverable via the ament index*, not just find_package()-able. A one-off diagnostic
          # run (echoing AMENT_PREFIX_PATH and `find`ing the installed marker file right after
          # sourcing install/setup.bash below) confirmed colcon's own per-package environment
          # extension already gets this right even within one combined colcon build call - so this
          # split turned out not to be the fix for the failure that followed (BUILD_SHARED_LIBS
          # below was) - kept anyway since it's the more explicit, easier-to-reason-about ordering,
          # and rmw_tickle needs neither rosidl_typesupport_tickle_c nor _tests so splitting costs
          # nothing extra.
          # -DBUILD_SHARED_LIBS=ON on both calls: confirmed via that same one-off diagnostic run that the
          # AMENT_PREFIX_PATH/ament-index registration itself was already correct (the marker file
          # existed, and was on AMENT_PREFIX_PATH) - the actual reason get_message_typesupport_
          # handle() still couldn't reach rosidl_typesupport_tickle_c was that rosidl_typesupport_c's
          # own runtime dispatch (rosidl_typesupport_c__get_message_typesupport_handle_function,
          # rosidl_typesupport_c/src/message_type_support_dispatch.cpp) loads a message's specific
          # typesupport implementation via dlopen() by convention name at *runtime* - impossible for
          # a plain .a static archive (CMake's own default absent BUILD_SHARED_LIBS), confirmed by
          # that same diagnostic run showing librosidl_typesupport_tickle_c.a getting built. /opt/
          # ros/jazzy's own apt-built packages are already shared (that's how apt-packaged ROS 2 is
          # always built) - only our own two packages, built fresh here, needed telling explicitly.
          colcon build \
            --packages-select rmw_tickle rosidl_typesupport_tickle_c rosidl_typesupport_tickle_cpp \
            --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_SHARED_LIBS=ON
          source install/setup.bash
          # rosidl_typesupport_tickle_c_tests_dep first (well, colcon topologically sorts this
          # regardless of listed order): rosidl_typesupport_tickle_c_tests' own msg/Branch.msg
          # nests one of its messages - a genuinely *cross-package* nested field, exercising
          # rosidl_typesupport_tickle_c_generate_interfaces.cmake's own cross-package -I wiring
          # (rmw_tickle/PLAN.md's own Milestone for it) for real, unlike test_msgs/Nested.msg's
          # own same-package BasicTypes field (Milestone 40) - both packages have to be in this
          # same --packages-select set, not just the one being tested, or find_package() below
          # would never find the dependency's own generated CMake config at all.
          colcon build \
            --packages-select rosidl_typesupport_tickle_c_tests_dep rosidl_typesupport_tickle_c_tests \
            --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DBUILD_SHARED_LIBS=ON
          # Merge rather than overwrite - the entries above (native + synthesised FreeRTOS) still
          # need to stay put for clang-tidy to lint everything else. rosidl_typesupport_tickle_c_
          # tests' own compile_commands.json is the one that actually has entries for the files
          # tickle_typesupport.ros2_cli generates (rosidl_typesupport_tickle_c_generate_interfaces.
          # cmake's extension runs inside *that* package's own CMake scope, not rmw_tickle's or
          # rosidl_typesupport_tickle_c's) - see rmw_tickle/PLAN.md's Milestone 1(c).
          #
          # examples/perf_hil/{cyclonedds,fastdds}/compile_commands.json - from the earlier
          # continue-on-error "Build examples/perf_hil" step above; may not exist at all if that
          # step's own real hardware-verified-but-not-CI-verified build failed on this runner, so
          # substitute an empty array rather than let a missing file break this merge too.
          [ -f examples/perf_hil/cyclonedds/compile_commands.json ] || echo '[]' > examples/perf_hil/cyclonedds/compile_commands.json
          [ -f examples/perf_hil/fastdds/compile_commands.json ] || echo '[]' > examples/perf_hil/fastdds/compile_commands.json
          jq -s 'add' compile_commands.json build/rmw_tickle/compile_commands.json \
            build/rosidl_typesupport_tickle_c/compile_commands.json \
            build/rosidl_typesupport_tickle_cpp/compile_commands.json \
            build/rosidl_typesupport_tickle_c_tests_dep/compile_commands.json \
            build/rosidl_typesupport_tickle_c_tests/compile_commands.json \
            examples/perf_hil/cyclonedds/compile_commands.json \
            examples/perf_hil/fastdds/compile_commands.json > compile_commands.tmp
          mv compile_commands.tmp compile_commands.json

      - name: Verify rosidl_typesupport_tickle_c/_cpp are reachable through the standard dispatch chain
        run: |
          # rmw_tickle/PLAN.md's Milestone 1(c) - the whole point of registering rosidl_
          # typesupport_tickle_c as a "rosidl_typesupport_c" ament_index resource (see that
          # package's own CMakeLists.txt) is that get_message_typesupport_handle() can reach it
          # the exact same way a real rmw_create_publisher() call would. rosidl_typesupport_
          # tickle_c_tests/test/test_dispatch.c (a message) and test_dispatch_srv.c (Milestone 4 -
          # a service, and transitively its own request/response messages via get_service_
          # typesupport_handle()) exercise precisely that chain (not just "the generated code
          # compiles") - install/setup.bash is needed so the dynamic loader can find the shared
          # library get_message_typesupport_handle_function()/get_service_typesupport_handle_
          # function() themselves dlopen() at runtime by convention name.
          #
          # test_dispatch_cpp/test_dispatch_srv_cpp exercise a *different* starting point -
          # rosidl_typesupport_cpp::get_message_type_support_handle<T>()/get_service_type_support_
          # handle<T>(), the ones a real rclcpp::Node/Client/Service actually use - and exist
          # because test_dispatch.c/test_dispatch_srv.c's own ROSIDL_GET_MSG_TYPE_SUPPORT()/
          # ROSIDL_GET_SRV_TYPE_SUPPORT() macros start one level lower (rosidl_typesupport_c
          # directly) and so never exercised the rosidl_typesupport_tickle_cpp gap that made
          # rmw_tickle unreachable from any real rclcpp application until this package was added -
          # see its own package.xml doc comment.
          #
          # test_dispatch_nested exercises cross-package nested resolution specifically (msg/
          # Branch.msg's own leaf_value field, from the separate rosidl_typesupport_tickle_c_
          # tests_dep package) - see rmw_tickle/PLAN.md's own Milestone for the CMake wiring this
          # proves actually works, not just compiles.
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ./build/rosidl_typesupport_tickle_c_tests/test_dispatch
          ./build/rosidl_typesupport_tickle_c_tests/test_dispatch_srv
          ./build/rosidl_typesupport_tickle_c_tests/test_dispatch_nested
          ./build/rosidl_typesupport_tickle_c_tests/test_dispatch_cpp
          ./build/rosidl_typesupport_tickle_c_tests/test_dispatch_srv_cpp

      - name: Verify RMW_IMPLEMENTATION=rmw_tickle selection works
        run: |
          # rmw_tickle/PLAN.md's Milestone 8 - register_rmw_implementation() (rmw_tickle/
          # CMakeLists.txt) registers the ament_index resources rmw_implementation's own
          # get_available_rmw_implementations()/get_default_rmw_implementation() read, but that
          # alone only proves the *marker* exists, not that the standard RMW_IMPLEMENTATION=
          # rmw_tickle *selection* mechanism can actually find and load this rmw. rmw_
          # implementation's own functions.cpp does that by dlopen()ing "librmw_tickle.so" (the
          # library name it derives from the RMW_IMPLEMENTATION value) and dlsym()ing the well-
          # known rmw_* symbols it needs - reproducing exactly that here (not a full rclcpp/rcl
          # round trip - no live two-process test infra exists yet for rmw_tickle, matching every
          # other milestone's own "compile+link, not live network" verification depth) is a much
          # stronger check than only confirming the ament_index resource marker's own text content.
          source install/setup.bash
          # A heredoc's own closing delimiter can't carry this step's indentation (bash requires
          # it unindented, but this YAML block scalar requires every line indented at least as
          # much as its first) - write the source with python3 instead, sidestepping the clash.
          python3 -c '
          import pathlib
          pathlib.Path("/tmp/verify_rmw_load.c").write_text(r"""
          #include <dlfcn.h>
          #include <stdio.h>
          #include <string.h>
          int main(void) {
              void* handle = dlopen("librmw_tickle.so", RTLD_NOW);
              if (!handle) {
                  fprintf(stderr, "dlopen(\"librmw_tickle.so\") failed: %s\n", dlerror());
                  return 1;
              }
              const char* (*get_id)(void) = (const char* (*)(void))dlsym(handle, "rmw_get_implementation_identifier");
              if (!get_id) {
                  fprintf(stderr, "dlsym(\"rmw_get_implementation_identifier\") failed: %s\n", dlerror());
                  return 1;
              }
              const char* id = get_id();
              printf("rmw_get_implementation_identifier() -> %s\n", id);
              if (strcmp(id, "rmw_tickle") != 0) {
                  fprintf(stderr, "unexpected implementation identifier: %s\n", id);
                  return 1;
              }
              return 0;
          }
          """)
          '
          gcc -o /tmp/verify_rmw_load /tmp/verify_rmw_load.c -ldl
          /tmp/verify_rmw_load

      - name: Run rmw_tickle's own test suite
        run: |
          # rmw_tickle/PLAN.md's Milestone 10 - a scoped test suite (test/test_qos.c, test/
          # test_node_lifecycle.c, test/test_guard_condition_wait.c, test/test_graph.c), plus this
          # is what actually makes this "a real colcon build+test CI job": every step above this
          # one only builds rmw_tickle far enough to lint/link it, never runs `colcon test` against
          # it at all.
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          # `|| true`: colcon test-result --verbose below is the actual pass/fail gate (and prints
          # a per-test breakdown) - letting a nonzero exit from `colcon test` itself short-circuit
          # this step early would skip that breakdown on failure.
          colcon test --packages-select rmw_tickle --event-handlers console_direct+ || true
          colcon test-result --verbose

      - name: Run the upstream rmw conformance suite (test_rmw_implementation) against rmw_tickle
        run: |
          # rmw_tickle/PLAN.md's Milestone 10 flagged this as its own "not done" item, and the
          # follow-up research that found it confirmed it's not a TickLE-specific idea either:
          # neither rmw_fastrtps_cpp's nor rmw_cyclonedds_cpp's own QUALITY_DECLARATION.md claims
          # any test suite of their own for this - both point at this exact upstream package
          # (ros2/rmw_implementation's test_rmw_implementation) for "Feature Testing"/"Public API
          # Testing", and the official "Creating an rmw implementation" tutorial names it as *the*
          # way to test a new rmw. Its own CMakeLists.txt auto-discovers every available rmw via
          # rmw_implementation_cmake's call_for_each_rmw_implementation() (the same get_available_
          # rmw_implementations() mechanism buildfarm_perf_tests already uses for rmw-perf.yml) -
          # rmw_tickle needs no test executables of its own, only to be present in AMENT_PREFIX_PATH
          # (already true - it was just built into install/ above) when this configures.
          #
          # Cloned fresh every run (this is a GitHub-hosted runner with no persistent state, unlike
          # rmw-perf.yml's own tickle-perf underlay) rather than provisioned once - its own
          # dependencies (rmw_dds_common, osrf_testing_tools_cpp, test_msgs, ament_cmake_ros) are
          # all plain apt-installable ROS 2 packages (confirmed from test_rmw_implementation's own
          # package.xml), unlike buildfarm_perf_tests' own two-DDS-vendor + performance_test
          # underlay - nothing here justifies a dedicated self-hosted runner.
          #
          # Branches: rmw_implementation at `jazzy` (matching this workflow's own ROS 2 distro -
          # `rolling`'s own version of test_rmw_implementation calls rmw_enclave_options_copy(),
          # an API this distro's actual installed rmw package doesn't have yet, found the hard way
          # via a real CI failure), test_interface_files at `rolling` (no jazzy-specific fork of
          # its own, and its content this old hasn't needed one), rcl_interfaces at `jazzy` (for
          # test_msgs - its own `rolling` branch trimmed test_msgs down to a handful of DDS-
          # security-key messages missing the classic BasicTypes/Constants/Empty/Strings set the
          # tests here actually need).
          git clone --branch jazzy --depth 1 https://github.com/ros2/rmw_implementation test_ws/src/rmw_implementation
          git clone --branch rolling --depth 1 https://github.com/ros2/test_interface_files test_ws/src/test_interface_files
          git clone --branch jazzy --depth 1 https://github.com/ros2/rcl_interfaces test_ws/src/rcl_interfaces
          git -C test_ws/src/rmw_implementation apply "$GITHUB_WORKSPACE/.github/scripts/rmw-conformance-patches/rmw_implementation_rmw_tickle.patch"
          git -C test_ws/src/rcl_interfaces apply "$GITHUB_WORKSPACE/.github/scripts/rmw-conformance-patches/test_msgs_rmw_tickle.patch"
          source /opt/ros/jazzy/setup.bash
          # This GitHub-hosted runner is fresh every run - ros-tooling/setup-ros installs rosdep
          # itself but never actually initializes/updates its own sources cache, unlike a real
          # persistent box (tickle-perf's own provisioning, README-rmw-perf.md, does this once by
          # hand) - found the hard way via a real CI failure ("rosdep installation has not been
          # initialized yet"). `rosdep init` itself fails loudly if a cache already exists (not the
          # case here, but harmless to guard anyway); `rosdep update` alone is not enough on a truly
          # fresh one.
          sudo rosdep init || true
          rosdep update --rosdistro jazzy
          # --from-paths narrowed to the three packages actually wanted, not the whole of either
          # clone: rmw_implementation's *other* package (also named rmw_implementation, confusingly
          # - the runtime dispatch one, not test_rmw_implementation) build_depends on all five DDS-
          # vendor rmws including rmw_connextdds (proprietary, not apt-installable at all) - it's
          # already on this runner anyway (part of ros-jazzy-ros-base, found via AMENT_PREFIX_PATH),
          # nothing here needs to rebuild it from source. rcl_interfaces similarly ships several
          # other packages (action_msgs, builtin_interfaces, ...) this step has no use for.
          rosdep install --from-paths \
            test_ws/src/rmw_implementation/test_rmw_implementation \
            test_ws/src/test_interface_files \
            test_ws/src/rcl_interfaces/test_msgs \
            --ignore-src -y --rosdistro jazzy
          # test_msgs' own ament_cmake_python step builds a setuptools egg for its (unused here)
          # Python bindings - the earlier "Set up Python" step's actions/setup-python@v5 puts a
          # hosted-tool CPython first on PATH (pythonLocation env var), and unlike jazzy's own
          # apt-packaged system Python, that one doesn't ship setuptools preinstalled - found via a
          # real CI failure ("No module named 'setuptools'").
          python3 -m pip install --quiet setuptools
          # This repo's own install/ (rmw_tickle + rosidl_typesupport_tickle_c/_cpp, built by an
          # earlier step) has to be sourced *before* building test_msgs below, not after - test_
          # msgs' own rosidl_generate_interfaces() call generates rmw_tickle's own typesupport for
          # each message at *this* configure/build time (same mechanism buildfarm_perf_tests'
          # own PERF_TEST_TOPICS messages go through), not lazily later when test_rmw_
          # implementation itself builds - found the hard way locally earlier this same session
          # (a stale-shell-ordering bug, not this specific line, but the identical underlying
          # "which typesupports were visible when this package configured" trap).
          source install/setup.bash
          colcon build --base-paths test_ws --build-base test_ws/build --install-base test_ws/install \
            --packages-select test_interface_files test_msgs \
            --cmake-args -DCMAKE_BUILD_TYPE=Release
          source test_ws/install/setup.bash
          colcon build --base-paths test_ws --build-base test_ws/build --install-base test_ws/install \
            --packages-select test_rmw_implementation --cmake-args -DCMAKE_BUILD_TYPE=Release
          source test_ws/install/setup.bash
          # `-R "_rmw_tickle$"`: this same workspace's own test_msgs/test_rmw_implementation get
          # rebuilt against whatever other rmws happen to be on this runner too (rmw_fastrtps_cpp,
          # the jazzy default) via the same call_for_each_rmw_implementation() auto-discovery - only
          # rmw_tickle's own results are this step's concern, not re-verifying FastDDS's already-
          # covered-elsewhere conformance.
          colcon test --base-paths test_ws --build-base test_ws/build --install-base test_ws/install \
            --packages-select test_rmw_implementation --event-handlers console_direct+ \
            --ctest-args -R "_rmw_tickle$" || true
          # `|| true` + a saved exit code, not a bare call: this step runs under `bash -e`, so a
          # real test failure here would otherwise abort the script before the summary table
          # below ever gets written - the one time that table is most worth having. Still exits
          # non-zero at the very end so a real regression still fails the job, same as before.
          colcon test-result --test-result-base test_ws/build --verbose && test_result_exit=0 || test_result_exit=$?
          # Same treatment rmw-perf.yml's own rmw_perf_summary.py already gives the performance
          # numbers - a Markdown table on this run's own Actions summary page, not just the
          # console log above, so a skim of the summary tab shows pass/skip/fail counts directly.
          echo "## rmw_tickle conformance (test_rmw_implementation)" >> "$GITHUB_STEP_SUMMARY"
          python3 .github/scripts/rmw_conformance_summary.py \
            test_ws/build/test_rmw_implementation/test_results >> "$GITHUB_STEP_SUMMARY"
          exit "$test_result_exit"

      - name: Check all
        uses: tsnlab/check@main
        with:
          python_version: '3.12'
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # submodules: true (above) puts third_party/lwip's own shell scripts on disk; they
          # aren't ours to lint. cpp-linter already auto-skips submodules; shellcheck needs telling.
          # build/ and install/ are colcon's own generated output (ament boilerplate:
          # local_setup.{bash,sh,zsh}, setup.{bash,sh,zsh}, package.{bash,sh}, ...) from the
          # rmw_tickle compile-db step above - not ours either, and gitignored besides.
          shellcheck_ignore_paths: third_party build install
