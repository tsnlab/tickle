name: FreeRTOS QEMU

# Unlike performance.yml (which needs the two real, exclusively-held Raspberry Pis and so only
# runs post-merge), this needs no real hardware at all - two QEMU processes on a normal
# GitHub-hosted runner stand in for the two nodes - so it can run on every push and PR like
# check-all.yml does.
on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # third_party/FreeRTOS-Kernel and third_party/lwip are submodules this build needs.
          submodules: true

      - name: Install RISC-V toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf picolibc-riscv64-unknown-elf \
            qemu-system-riscv

      - name: Lint (platform/freertos)
        run: make -C platform/freertos lint

      - name: Two-instance round trip (ping/pong over virtio-net)
        run: platform/freertos/run_pair.sh

      - name: Upload logs and pcaps
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: freertos-qemu-logs
          path: |
            platform/freertos/*.log
            platform/freertos/*.pcap
          if-no-files-found: ignore
