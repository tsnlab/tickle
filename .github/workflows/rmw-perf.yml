name: rmw_tickle performance

# Tracks rmw_tickle's own before/after performance via ros2/buildfarm_perf_tests - not a
# cross-vendor comparison against rmw_fastrtps_cpp/rmw_cyclonedds_cpp (see PERF_TEST_RMW_
# IMPLEMENTATIONS below and README-rmw-perf.md for why that comparison isn't a fair one on this
# same-host rig).

# push (main only) + workflow_dispatch - not pull_request, ever: DESIGN.md's "no pull_request
# trigger, ever" rule for any workflow using a self-hosted-runner label on this public repo (see
# .github/scripts/README.md) applies here exactly as it does to `tickle-hil`/performance.yml.
# concurrency below serializes runs the same way performance.yml's own perf-main group does -
# this rig only has one of everything (one build/install tree under ~/rmw_perf_ws, one runner),
# so two overlapping runs would corrupt each other's in-progress rebuild.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: rmw-perf-main
  cancel-in-progress: true

jobs:
  compare:
    # A different rig from `tickle-hil` (performance.yml) - one Ubuntu machine running a full
    # ROS 2 stack, not a pair of Raspberry Pis running TickLE's own plain Makefile build. See
    # .github/scripts/README-rmw-perf.md for what must already be provisioned on it before this
    # workflow can do anything useful.
    runs-on: [self-hosted, tickle-perf]
    timeout-minutes: 30

    env:
      # Not necessarily "jazzy" - each ROS 2 distro officially targets one specific Ubuntu release,
      # and this rig's actual Ubuntu version dictates which one packages.ros.org has binaries for
      # at all (see README-rmw-perf.md's own "What's needed" section for how this runner's real
      # value was determined - Ubuntu 26.04 here has no Jazzy build, only "lyrical"). Update this
      # if the runner ever moves to a different Ubuntu release.
      ROS_DISTRO_NAME: lyrical
      # rmw_tickle's own "Supported subset" (rmw_tickle/PLAN.md): only flat messages under
      # TickLE's single-datagram ceiling (tt_MAX_BUFFER_LENGTH = 1472 bytes, include/tickle/
      # config.h - no fragmentation) and no nested-message types (rosidl_typesupport_tickle_c
      # doesn't generate for those yet - confirmed the hard way: Struct256 embeds a nested
      # Struct16 field, so it's excluded here, not just "small enough" - see README-rmw-perf.md's
      # own provisioning notes on the Array1k/Struct16.msg symlink workaround this rig needs).
      PERF_TEST_TOPICS: "Array1k;Struct16"
      # rmw_tickle only - not a cross-vendor comparison. buildfarm_perf_tests' own "two-process"
      # test shape launches both sides as local child processes via launch_ros.actions.Node, which
      # has no remote-host launch capability at all - "two-process" always means one host, two OS
      # processes, never two real hosts. That structurally favors any rmw with a same-host shared-
      # memory transport (FastDDS/CycloneDDS both auto-negotiate one) over rmw_tickle, which only
      # ever has real UDP sockets (hal_linux.c) - a byproduct of what TickLE targets (an actual
      # network medium, e.g. 10Base-T1S) rather than a real deficiency, but not a fair fight either
      # way. So this rig now tracks rmw_tickle's own before/after regressions only (still useful:
      # it already caught two real wire-level bugs - PLAN.md's Milestone 12) rather than claiming
      # an absolute "faster/slower than FastDDS/CycloneDDS" number this same-host setup can't
      # honestly produce. See README-rmw-perf.md for the full reasoning.
      PERF_TEST_RMW_IMPLEMENTATIONS: "rmw_tickle"
      # Short by buildfarm_perf_tests' own default (30s/topic) for a first pass across 2 topics x
      # 3 rmws x 2 sync modes - revisit once real per-combo runtime on this rig is known.
      PERF_TEST_RUNTIME: "10"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve workspace paths
        run: |
          # $HOME only resolves correctly inside a shell (a YAML `env:` value is a literal string,
          # never shell-expanded, and `${{ github.workspace }}` is the checkout dir, not the
          # runner's home) - GITHUB_ENV is the one way to compute this once and have every later
          # step (and action input) see the real value as `$RMW_PERF_WS`/`${{ env.RMW_PERF_WS }}`.
          # Must match .github/scripts/README-rmw-perf.md's own provisioning location exactly.
          echo "RMW_PERF_WS=$HOME/rmw_perf_ws" >> "$GITHUB_ENV"
          echo "RMW_PERF_RESULTS_DIR=$HOME/rmw_perf_ws/build/buildfarm_perf_tests/test_results/buildfarm_perf_tests" >> "$GITHUB_ENV"

      - name: Build rmw_tickle against the pre-provisioned ROS 2 + DDS-vendor underlay
        run: |
          # Sourcing order matters: base ROS 2 first, then the buildfarm_perf_tests/performance_
          # test underlay (an overlay on top of it - see README-rmw-perf.md's own provisioning
          # steps), then this repo's own fresh build becomes a second overlay on top of both.
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          source "$RMW_PERF_WS/install/setup.bash"
          colcon build \
            --packages-select rmw_tickle rosidl_typesupport_tickle_c rosidl_typesupport_tickle_cpp \
            --cmake-args -DBUILD_SHARED_LIBS=ON
          # BUILD_SHARED_LIBS=ON: rosidl_typesupport_c's own runtime dispatch dlopen()s a
          # message's specific typesupport implementation by convention name - impossible for a
          # plain .a static archive (see rmw_tickle/PLAN.md's Milestone 1(b)+(c) - the same fix
          # check-all.yml's own colcon build needed for the identical reason).

      - name: Rebuild buildfarm_perf_tests with rmw_tickle now visible
        run: |
          # get_available_rmw_implementations() (rmw_implementation_cmake) - what buildfarm_
          # perf_tests' own test/CMakeLists.txt uses to discover installed rmws - runs at *this*
          # package's own CMake configure time, reading whatever's in AMENT_PREFIX_PATH right now.
          # It was already built once during one-time provisioning (README-rmw-perf.md), before
          # rmw_tickle existed anywhere - so it has to be reconfigured/rebuilt here, every run,
          # now that the previous step's overlay puts rmw_tickle in AMENT_PREFIX_PATH too. This is
          # the one part of the pre-provisioned workspace CI does rebuild - performance_test and
          # buildfarm_perf_tests' own other dependencies (test_msgs, rmw_dds_common,
          # osrf_testing_tools_cpp, ...) are untouched, still the ones built during provisioning.
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          source "$RMW_PERF_WS/install/setup.bash"
          source install/setup.bash
          # --build-base/--install-base explicitly: colcon's own defaults are relative to the
          # *current directory* (this job's repo checkout), not to --base-paths - without these,
          # build/install output would land inside the git checkout instead of alongside
          # buildfarm_perf_tests' own sources in $RMW_PERF_WS, where every later step here (and
          # README-rmw-perf.md's own provisioning) expects to find it.
          colcon build \
            --base-paths "$RMW_PERF_WS" \
            --build-base "$RMW_PERF_WS/build" \
            --install-base "$RMW_PERF_WS/install" \
            --packages-select buildfarm_perf_tests \
            --cmake-args \
              -DPERF_TEST_TOPICS="$PERF_TEST_TOPICS" \
              -DPERF_TEST_RMW_IMPLEMENTATIONS="$PERF_TEST_RMW_IMPLEMENTATIONS" \
              -DPERF_TEST_RUNTIME="$PERF_TEST_RUNTIME" \
            --cmake-force-configure

      - name: Run the benchmark
        run: |
          source "/opt/ros/$ROS_DISTRO_NAME/setup.bash"
          source "$RMW_PERF_WS/install/setup.bash"
          source install/setup.bash
          # Restricted to buildfarm_perf_tests' own "two-process, via ROS2/rmw" test shape (-R, a
          # ctest name regex passed through --ctest-args) - the *only* shape that sidesteps
          # rmw_tickle's own one-node-per-process limit (rmw_tickle/PLAN.md's Milestone 2
          # "Deferred" note) and actually exercises rmw_tickle through the same rclcpp/rmw boundary
          # a real ROS 2 user reaches it through. Excludes, deliberately: single-process/test_
          # spinning shapes, which hit real, already-documented, out-of-scope gaps for rmw_tickle
          # specifically (see PLAN.md's Milestone 11 row); and - the reason for anchoring on
          # "two_process_rmw_" rather than just "two_process" - buildfarm_perf_tests' own test/
          # CMakeLists.txt *also* generates "two_process_FastRTPS_*"/"two_process_CycloneDDS_*"
          # tests unconditionally, each DDS vendor's raw *native* API against itself with no rmw/
          # ROS2 involved at all (a different axis entirely, not something rmw_tickle could ever
          # join since it isn't a DDS vendor, and not built here anyway now that PERF_TEST_RMW_
          # IMPLEMENTATIONS above is rmw_tickle-only) - "rmw_" is present only in the ROS2-mode
          # test names ("two_process_rmw_tickle_...").
          # Stale xunit.xml files from a *previous* run (this runner's own build tree persists
          # across runs, unlike a fresh GitHub-hosted checkout) linger here otherwise -
          # colcon test-result --verbose below scans every xunit.xml under --test-result-base
          # regardless of whether -R above re-ran it this time, so a past failure (e.g. one of
          # the single-process tests this job deliberately never runs) would fail this job
          # forever after, even though nothing this job actually did produced it.
          rm -rf "$RMW_PERF_WS/build/buildfarm_perf_tests/test_results"
          # This benchmark's own numbers (published below regardless) are the actual point of
          # this job, not a pass/fail gate - `|| true` on both colcon calls so one bad run (or a
          # real environment hiccup) never blocks every future push's table from showing up.
          # colcon test-result's own per-test breakdown still prints either way, for whoever
          # reads this step's log.
          colcon test \
            --base-paths "$RMW_PERF_WS" \
            --build-base "$RMW_PERF_WS/build" \
            --install-base "$RMW_PERF_WS/install" \
            --packages-select buildfarm_perf_tests \
            --event-handlers console_direct+ \
            --ctest-args -R two_process_rmw_ || true
          colcon test-result --test-result-base "$RMW_PERF_WS/build" --verbose || true

      - name: Publish benchmark table
        if: always()
        run: |
          # buildfarm_perf_tests' own per-test PERF_TEST_RESULTS_BASE_PATH (test/add_performance_
          # tests.cmake) lands each *_results_<rmw>_<sync>_<topic>.benchmark.json here, one per
          # two-process ctest that actually ran - see rmw_perf_summary.py's own doc comment for
          # the exact filename shape it parses. GITHUB_STEP_SUMMARY renders as Markdown directly
          # on this run's own Actions summary page - no separate dashboard needed for this first
          # pass (rmw_tickle/PLAN.md's benchmark plan deliberately started with raw
          # artifacts/no-dashboard; this is the smallest useful step up from that, still nothing
          # bespoke to maintain).
          python3 .github/scripts/rmw_perf_summary.py "$RMW_PERF_RESULTS_DIR" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmw-perf-results
          path: |
            ${{ env.RMW_PERF_WS }}/build/buildfarm_perf_tests/**
          if-no-files-found: warn
