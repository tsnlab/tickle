name: Performance Test

on:
  push:
    branches: [main]
  workflow_dispatch:

# If a newer push lands on main while a run is still going, cancel the older one so
# only the latest commit's run ever occupies the hardware.
concurrency:
  group: perf-main
  cancel-in-progress: true

permissions:
  contents: write # github-action-benchmark pushes result history to gh-pages

jobs:
  test:
    runs-on: [self-hosted, tickle-hil]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run hardware-in-the-loop performance tests
        run: .github/scripts/run_perf.sh

      # All 11 groups below are sourced from examples/perf_hil/tickle/* (comparison.md's own §2-3
      # HIL methodology), not run_perf.sh's former examples/linux/perf tool - see run_perf.sh's own
      # top comment for why this switch happened. fail-on-alert: true only for the two throughput
      # groups (the only ones a 200%-regression alert can distinguish from expected run-to-run
      # noise); every other group is graphed/summarized but never gates the build, same reasoning
      # the old workflow used for its own noisy groups (jitter, loss_pct, detection timing).
      - name: Track best_effort_latency history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: TickLE HIL - best_effort_latency (avg RTT ms)
          tool: customSmallerIsBetter
          output-file-path: best_effort_latency-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: false
          max-items-in-chart: 100

      - name: Track reliable_latency history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: TickLE HIL - reliable_latency (avg RTT ms)
          tool: customSmallerIsBetter
          output-file-path: reliable_latency-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: false
          max-items-in-chart: 100

      - name: Track best_effort_throughput history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: TickLE HIL - best_effort_throughput (recv msgs)
          tool: customBiggerIsBetter
          output-file-path: best_effort_throughput-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: true
          alert-threshold: "200%"
          max-items-in-chart: 100

      - name: Track reliable_throughput recv history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: TickLE HIL - reliable_throughput (recv @ 0/1/5% tc loss)
          tool: customBiggerIsBetter
          output-file-path: reliable_throughput_recv-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: true
          alert-threshold: "200%"
          max-items-in-chart: 100

      # loss_pct under real max-rate tc loss - see rmw_tickle/PLAN.md's own Milestone 65 for why
      # this number is genuinely noisy run-to-run and not (yet) a clean regression signal.
      - name: Track reliable_throughput loss_pct history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: TickLE HIL - reliable_throughput (loss_pct @ 1/5% tc loss)
          tool: customSmallerIsBetter
          output-file-path: reliable_throughput_loss-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: false
          max-items-in-chart: 100

      - name: Track durability_late_join durable-recv history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: TickLE HIL - durability_late_join (durable recv)
          tool: customBiggerIsBetter
          output-file-path: durability_late_join_durable-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: false
          max-items-in-chart: 100

      # Expected value is 0 (VOLATILE drops the late-joiner's backlog by design) - tracked
      # smaller-is-better so a nonzero/growing value would actually be visible as a regression.
      - name: Track durability_late_join volatile-recv history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: TickLE HIL - durability_late_join (volatile recv, expect 0)
          tool: customSmallerIsBetter
          output-file-path: durability_late_join_volatile-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: false
          max-items-in-chart: 100

      - name: Track history_depth_burst_loss history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: TickLE HIL - history_depth_burst_loss (recv, within/beyond depth)
          tool: customBiggerIsBetter
          output-file-path: history_depth_burst_loss-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: false
          max-items-in-chart: 100

      - name: Track deadline_miss_detection history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: TickLE HIL - deadline_miss_detection (writer_misses)
          tool: customSmallerIsBetter
          output-file-path: deadline_miss_detection-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: false
          max-items-in-chart: 100

      - name: Track liveliness_loss_detection history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: TickLE HIL - liveliness_loss_detection (detect ms @ 1/2/4s lease)
          tool: customSmallerIsBetter
          output-file-path: liveliness_loss_detection-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: false
          max-items-in-chart: 100

      - name: Track lifespan_expiry history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: TickLE HIL - lifespan_expiry (lost @ 1.0/1.5/2.0s pause)
          tool: customSmallerIsBetter
          output-file-path: lifespan_expiry-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: false
          max-items-in-chart: 100

      # run_perf.sh writes perf-frag.json (Raspberry Pi build/test outcome + the measured
      # numbers) even when it aborts early; hand it to the publish job below.
      - name: Upload dashboard fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-frag
          path: perf-frag.json
          if-no-files-found: warn

  # Folding the perf numbers into the shared status table is done on a hosted runner (python3 +
  # a clean git checkout, no dependence on whatever the self-hosted box has), not on tickle-hil.
  publish:
    needs: test
    # Runs whether `test` passed or failed (so a broken HIL run still lands as a red row), but
    # not when the whole run was cancelled - e.g. superseded by a newer push (concurrency above).
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download dashboard fragment
        uses: actions/download-artifact@v4
        with:
          name: perf-frag

      - name: Publish dashboard (perf section)
        # A flaky gh-pages push shouldn't turn "Performance Test" red - the `test` job is the signal.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish_dashboard.sh perf perf-frag.json
