name: Performance Test

on:
  push:
    branches: [main]
  workflow_dispatch:

# If a newer push lands on main while a run is still going, cancel the older one so
# only the latest commit's run ever occupies the hardware.
concurrency:
  group: perf-main
  cancel-in-progress: true

permissions:
  contents: write # github-action-benchmark pushes result history to gh-pages

jobs:
  test:
    runs-on: [self-hosted, tickle-hil]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run hardware-in-the-loop performance tests
        run: .github/scripts/run_perf.sh

      - name: Track latency history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Latency (ping/pong)
          tool: customSmallerIsBetter
          output-file-path: latency-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: true
          alert-threshold: "200%"

      # rtt mdev (jitter) lives in its own group, not latency-benchmark.json above: it's noisy
      # enough on real hardware to trip a 200% alert on commits that couldn't have affected it
      # (three separate false alarms in one session - see run_perf.sh's own comment on why it's
      # split out). Still tracked/graphed (summary-always, auto-push), just never fails the build.
      - name: Track latency jitter history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Latency jitter (ping/pong rtt mdev)
          tool: customSmallerIsBetter
          output-file-path: latency-jitter-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: false

      - name: Track throughput history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Throughput (perf_client/perf_server)
          tool: customBiggerIsBetter
          output-file-path: throughput-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: true
          alert-threshold: "200%"

      # QoS roadmap #5 (RELIABILITY/RELIABLE, rmw_tickle/PLAN.md) - same -R run as the best-effort
      # throughput one above, tracking RELIABLE delivery's own throughput cost.
      - name: Track reliable throughput history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Reliable throughput (perf_client/perf_server -R)
          tool: customBiggerIsBetter
          output-file-path: reliable-throughput-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: true
          alert-threshold: "200%"

      # Split from the group above the same way latency jitter is split from latency: a different
      # alert direction, and - since run_perf.sh's own "reliable" scenario comment explains this
      # isn't a clean recovered-vs-lost measurement yet - not something that should fail the build
      # on its own either. Still tracked/graphed (summary-always, auto-push).
      - name: Track reliable loss history
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Reliable loss_pct (perf_client/perf_server -R)
          tool: customSmallerIsBetter
          output-file-path: reliable-loss-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: false

      # tc/netem loss-injection scenarios (run_perf.sh's own probe_loss_testing()) - these two
      # files only exist when rpi#1 has passwordless `sudo tc` set up (see .github/scripts/
      # README.md); `if:` skips both steps cleanly rather than failing the job when they don't,
      # since github-action-benchmark itself has no "skip if missing" input of its own. Each file
      # holds six named entries (BEST_EFFORT/RELIABLE x 1%/5%/10% loss) in one group/graph rather
      # than six separate ones - see run_perf.sh's own comment on why.
      - name: Track loss-injection throughput history
        if: ${{ hashFiles('loss-throughput-benchmark.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Throughput under packet loss (BEST_EFFORT vs RELIABLE)
          tool: customBiggerIsBetter
          output-file-path: loss-throughput-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: true
          alert-threshold: "200%"

      # One-way latency (perf_server.c's own new avg_latency_ms) is only as accurate as the two
      # Pis' clock sync (NTP) - see perf_server.c's own comment - so, like rtt jitter and reliable
      # loss_pct above, this is graphed but never gates the build on its own.
      - name: Track loss-injection latency history
        if: ${{ hashFiles('loss-latency-benchmark.json') != '' }}
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Latency under packet loss (BEST_EFFORT vs RELIABLE)
          tool: customSmallerIsBetter
          output-file-path: loss-latency-benchmark.json
          gh-pages-branch: gh-pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          summary-always: true
          fail-on-alert: false

      # run_perf.sh writes perf-frag.json (Raspberry Pi build/test outcome + the measured
      # numbers) even when it aborts early; hand it to the publish job below.
      - name: Upload dashboard fragment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-frag
          path: perf-frag.json
          if-no-files-found: warn

  # Folding the perf numbers into the shared status table is done on a hosted runner (python3 +
  # a clean git checkout, no dependence on whatever the self-hosted box has), not on tickle-hil.
  publish:
    needs: test
    # Runs whether `test` passed or failed (so a broken HIL run still lands as a red row), but
    # not when the whole run was cancelled - e.g. superseded by a newer push (concurrency above).
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dashboard fragment
        uses: actions/download-artifact@v4
        with:
          name: perf-frag

      - name: Publish dashboard (perf section)
        # A flaky gh-pages push shouldn't turn "Performance Test" red - the `test` job is the signal.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish_dashboard.sh perf perf-frag.json
