[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tickle-typesupport"
version = "0.1.0"
description = "Generates TickLE codecs (.c/.h) from ROS 2 .msg/.srv interface files"
requires-python = ">=3.10"
# Pinned to match ROS 2's own dependency (e.g. Humble/Jazzy ship python3-empy 3.3.4) - empy's
# 4.x is an incompatible rewrite. The .msg/.srv parser itself is vendored (see
# tickle_typesupport/_rosidl_parser.py), not a dependency.
dependencies = ["empy==3.3.4"]

[project.scripts]
tickle-typesupport = "tickle_typesupport.cli:main"

[tool.setuptools.packages.find]
include = ["tickle_typesupport*"]

# render.py reads these at runtime (pathlib.Path(__file__).parent / "templates") - without this,
# setuptools' default file discovery only picks up .py files, so a real (non-editable) `pip
# install` - exactly what check-all.yml's `make regen` step and any real consumer does, unlike
# this repo's own `pip install -e .` dev setup, which just points at the source tree directly -
# would silently ship a package with no templates/ at all.
[tool.setuptools.package-data]
tickle_typesupport = ["templates/*.em"]
